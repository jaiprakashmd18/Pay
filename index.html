<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZDC Global Payment Portal</title>
    <!-- Dependencies -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0b0d; --card: #161b22; --accent: #3395ff; --border: #30363d;
            --text: #ffffff; --sec: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        
        .card { 
            background: var(--card); 
            width: 100%; 
            max-width: 480px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            padding: 25px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
        
        label { display: block; font-size: 0.65rem; text-transform: uppercase; color: var(--sec); margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }
        
        .input-box { 
            width: 100%; 
            padding: 14px; 
            background: #0d1117; 
            border: 1px solid var(--border); 
            color: white; 
            border-radius: 12px; 
            outline: none; 
            font-size: 1rem; 
            margin-bottom: 15px; 
        }
        .input-box:focus { border-color: var(--accent); }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .live-math { 
            background: rgba(51, 149, 255, 0.04); 
            border: 1px solid rgba(51, 149, 255, 0.2); 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 20px; 
            text-align: center;
        }
        
        .total-line { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .total-label { font-size: 0.75rem; color: var(--sec); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn { 
            width: 100%; 
            padding: 16px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .badge { display: inline-block; padding: 4px 8px; background: rgba(35, 134, 54, 0.15); color: #3fb950; border-radius: 4px; font-size: 0.6rem; font-weight: 700; margin-bottom: 8px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="card">
    <div class="header">
        <span class="badge">SECURE ENCRYPTED GATEWAY</span>
        <h2>ZDC Global Checkout</h2>
    </div>

    <label>Full Name</label>
    <input type="text" id="client-name" class="input-box" placeholder="Name">

    <label>Phone Number</label>
    <input type="tel" id="client-phone" class="input-box" placeholder="+0 ...">

    <label>Amount (Requested)</label>
    <input type="number" id="amt" class="input-box" value="10.00" min="10">

    <div class="row">
        <div class="form-group">
            <label>Currency to Get</label>
            <select id="target-cur" class="input-box">
                <option value="USD">USD ($)</option>
                <option value="GEL">GEL (₾)</option>
                <option value="EUR">EUR (€)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Pay Using</label>
            <select id="pay-cur" class="input-box">
                <option value="INR" selected>INR (₹)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
            </select>
        </div>
    </div>

    <div class="live-math">
        <div class="total-label">Total Amount Payable</div>
        <div class="total-line"><span id="out-total">--</span></div>
    </div>

    <button class="btn" id="pay-btn">Initialize Payment</button>
</div>

<script>
    const RZP_KEY = 'rzp_test_SlAhlNeWJ4YdsA'; 
    const MIN_USD = 10.00;
    const SYSTEM_FEE_USD = 14; 
    const sym = { USD: '$', INR: '₹', EUR: '€', GEL: '₾', GBP: '£', AED: 'د.إ', CAD: '$' };
    let liveRates = {};
    let finalSelection = {};

    // Security: Disable F12 and Inspect Element
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };

    async function syncRates() {
        try {
            const res = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await res.json();
            liveRates = data.rates;
            calculate();
        } catch (e) {
            liveRates = { USD: 1, INR: 83.5, EUR: 0.93, GEL: 2.7, GBP: 0.79, AED: 3.67, CAD: 1.37 };
            calculate();
        }
    }

    function applyRounding(val, curr) {
        if (curr === 'INR') return Math.ceil(val / 10) * 10;
        if (['USD', 'EUR'].includes(curr)) return Math.floor(val) + 0.90;
        return Math.ceil(val); 
    }

    function calculate() {
        if (!liveRates.USD) return;
        const amountWanted = parseFloat(document.getElementById('amt').value) || 0;
        const targetCur = document.getElementById('target-cur').value;
        const payCur = document.getElementById('pay-cur').value;

        const crossRate = liveRates[payCur] / liveRates[targetCur];
        const finalBase = amountWanted * crossRate;
        
        const feeInPayCur = (SYSTEM_FEE_USD * liveRates[payCur]) * 1.05;
        const roundedFee = applyRounding(feeInPayCur, payCur);
        const total = finalBase + roundedFee;

        document.getElementById('out-total').innerText = `${sym[payCur] || payCur} ${total.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

        finalSelection = { 
            amt: Math.round(Number(total.toFixed(2)) * 100), 
            cur: payCur,
            requested: amountWanted,
            targetCur: targetCur,
            desc: `ZDC Exchange: ${amountWanted} ${targetCur}`
        };
    }

    async function generatePDF(res, selection, name, phone) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFont("helvetica", "bold");
        doc.text("ZDC GLOBAL PAYMENT RECEIPT", 105, 20, { align: "center" });
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        
        const details = [
            ["Transaction ID", res.razorpay_payment_id],
            ["Date", new Date().toLocaleString()],
            ["Client Name", name],
            ["Phone", phone],
            ["Service", selection.desc],
            ["Total Paid", `${sym[selection.cur]} ${(selection.amt / 100).toFixed(2)}`],
            ["Status", "SUCCESSFUL"]
        ];

        let y = 40;
        details.forEach(detail => {
            doc.text(`${detail[0]}:`, 20, y);
            doc.text(detail[1], 70, y);
            y += 10;
        });

        doc.save(`ZDC_Receipt_${res.razorpay_payment_id}.pdf`);
    }

    function processPayment() {
        const name = document.getElementById('client-name').value;
        const phone = document.getElementById('client-phone').value;
        const amountRequested = parseFloat(document.getElementById('amt').value);

        const targetCur = document.getElementById('target-cur').value;
        const amtInUSD = amountRequested / liveRates[targetCur];

        if (!name || !phone) { alert("Please provide customer details."); return; }
        if (amtInUSD < MIN_USD) { alert(`Minimum order is $10.00 USD.`); return; }

        const options = {
            key: RZP_KEY,
            amount: finalSelection.amt,
            currency: finalSelection.cur,
            name: "ZDC Global",
            description: finalSelection.desc,
            handler: function(response) {
                generatePDF(response, finalSelection, name, phone);
                alert("Success! Your PDF receipt has been generated.");
                location.reload();
            },
            prefill: { name: name, contact: phone },
            theme: { color: "#3395ff" }
        };
        new Razorpay(options).open();
    }

    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calculate));
    document.getElementById('pay-btn').onclick = processPayment;
    syncRates();
</script>

</body>
</html>
