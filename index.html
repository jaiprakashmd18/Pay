<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZDC Global Payment Portal</title>
    <!-- Dependencies -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0b0d; --card: #161b22; --accent: #3395ff; --border: #30363d;
            --text: #ffffff; --sec: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        
        .card { 
            background: var(--card); 
            width: 100%; 
            max-width: 500px; 
            border-radius: 24px; 
            border: 1px solid var(--border); 
            padding: 30px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
        
        label { display: block; font-size: 0.7rem; text-transform: uppercase; color: var(--sec); margin-bottom: 8px; font-weight: 700; letter-spacing: 1.2px; }
        
        .input-box { 
            width: 100%; 
            padding: 14px; 
            background: #0d1117; 
            border: 1px solid var(--border); 
            color: white; 
            border-radius: 12px; 
            outline: none; 
            font-size: 1rem; 
            margin-bottom: 20px; 
        }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .live-math { 
            background: rgba(51, 149, 255, 0.06); 
            border: 1px solid rgba(51, 149, 255, 0.2); 
            border-radius: 16px; 
            padding: 24px; 
            margin-bottom: 25px; 
            text-align: center;
        }
        
        .total-line { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
        .total-label { font-size: 0.75rem; color: var(--sec); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; }
        
        .btn { 
            width: 100%; 
            padding: 18px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s ease;
        }
        .btn:hover { background: #4ca3ff; transform: translateY(-1px); }
        .badge { display: inline-block; padding: 4px 10px; background: rgba(35, 134, 54, 0.15); color: #3fb950; border-radius: 6px; font-size: 0.65rem; font-weight: 700; margin-bottom: 12px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="card">
    <div class="header">
        <span class="badge">SECURE ENCRYPTED PORTAL</span>
        <h2>ZDC Global</h2>
    </div>

    <label>Customer Name</label>
    <input type="text" id="client-name" class="input-box" placeholder="Full Name">

    <label>Phone Number</label>
    <input type="tel" id="client-phone" class="input-box" placeholder="+1 ...">

    <label>Amount (Requested)</label>
    <input type="number" id="amt" class="input-box" value="100.00" min="10">

    <div class="row">
        <div class="form-group">
            <label>You Get</label>
            <select id="target-cur" class="input-box">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GEL">GEL (₾)</option>
                <option value="GBP">GBP (£)</option>
            </select>
        </div>
        <div class="form-group">
            <label>You Pay In</label>
            <select id="pay-cur" class="input-box">
                <option value="INR" selected>INR (₹)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="AED">AED (د.إ)</option>
                <option value="SAR">SAR (ر.س)</option>
            </select>
        </div>
    </div>

    <div class="live-math">
        <div class="total-label">Final Payable Total</div>
        <div class="total-line"><span id="out-total">--</span></div>
    </div>

    <button class="btn" id="pay-btn">Proceed to Payment</button>
</div>

<script>
    const RZP_KEY = 'rzp_live_S2txcF6a0q5CDJ'; 
    const MIN_USD = 10.00;
    const SYSTEM_FEE_USD = 14; 
    
    const sym = { 
        USD: '$', INR: '₹', EUR: '€', GEL: '₾', GBP: '£', AED: 'د.إ', SAR: 'ر.س'
    };

    let liveRates = {};
    let finalSelection = {};

    document.onkeydown = (e) => {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };

    async function syncRates() {
        try {
            const res = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await res.json();
            liveRates = data.rates;
            calculate();
        } catch (e) {
            liveRates = { USD: 1, INR: 83.5, EUR: 0.92, GBP: 0.78, GEL: 2.7 };
            calculate();
        }
    }

    function calculate() {
        if (!liveRates.USD) return;
        const amountWanted = parseFloat(document.getElementById('amt').value) || 0;
        const targetCur = document.getElementById('target-cur').value;
        const payCur = document.getElementById('pay-cur').value;

        const crossRate = liveRates[payCur] / liveRates[targetCur];
        const finalBase = amountWanted * crossRate;
        const feeInPayCur = (SYSTEM_FEE_USD * liveRates[payCur]) * 1.05;
        
        let roundedFee = Math.ceil(feeInPayCur);
        if(payCur === 'INR') roundedFee = Math.ceil(feeInPayCur / 10) * 10;
        
        const total = finalBase + roundedFee;
        const s = sym[payCur] || payCur;

        // Display with 2 decimals in UI
        document.getElementById('out-total').innerText = `${s} ${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

        finalSelection = { 
            amt: Math.round(Number(total.toFixed(2)) * 100), 
            cur: payCur,
            requested: amountWanted,
            targetCur: targetCur,
            // Store strictly formatted string for PDF
            totalFormatted: `${s} ${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`
        };
    }

    function generateInvoice(res, selection, name, phone) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const margin = 20;
        const pageWidth = doc.internal.pageSize.width;
        const rightEdge = pageWidth - margin;

        // 1. Header Blue Bar
        doc.setFillColor(51, 149, 255);
        doc.rect(0, 0, pageWidth, 45, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(26);
        doc.text("ZDC GLOBAL", margin, 25);
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text("SECURE FINANCIAL SERVICES", margin, 33);
        doc.setFontSize(14);
        doc.text("PAID", rightEdge, 28, { align: 'right' });

        // 2. Info Grid
        doc.setTextColor(40, 40, 40);
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text("BILL TO:", margin, 60);
        doc.text("TRANSACTION DETAILS:", 115, 60);

        doc.setDrawColor(230, 230, 230);
        doc.line(margin, 63, rightEdge, 63);

        doc.setFont("helvetica", "normal");
        doc.text(`Name: ${name}`, margin, 70);
        doc.text(`Contact: ${phone}`, margin, 76);
        doc.text(`Order ID: #ZDC-${res.razorpay_payment_id.slice(-6).toUpperCase()}`, 115, 70);
        doc.text(`Payment ID: ${res.razorpay_payment_id}`, 115, 76);
        doc.text(`Date: ${new Date().toLocaleString()}`, 115, 82);

        // 3. Table - Optimized Alignment
        doc.autoTable({
            startY: 95,
            head: [['Description', 'Qty', 'Currency', 'Total']],
            body: [
                [`Exchange Service (${selection.requested} ${selection.targetCur})`, '1', selection.cur, selection.totalFormatted],
            ],
            headStyles: { fillColor: [51, 149, 255], textColor: 255, halign: 'center' },
            bodyStyles: { textColor: 40 },
            columnStyles: { 
                0: { cellWidth: 90, halign: 'left' },
                1: { cellWidth: 20, halign: 'center' },
                2: { cellWidth: 30, halign: 'center' },
                3: { cellWidth: 30, halign: 'right' } 
            },
            margin: { left: margin, right: margin },
            theme: 'grid'
        });

        // 4. TOTAL ROW - REPAIRED ALIGNMENT
        const finalY = doc.lastAutoTable.finalY + 15;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        
        // Align Label
        doc.text("TOTAL AMOUNT PAID:", 100, finalY);
        
        // Align Value Flush to Right Edge of the Table
        doc.setTextColor(51, 149, 255);
        doc.text(selection.totalFormatted, rightEdge, finalY, { align: 'right' });

        // Footer
        doc.setFontSize(8);
        doc.setTextColor(170, 170, 170);
        doc.text("This receipt is verified and digitally signed for security.", pageWidth / 2, 280, { align: 'center' });

        doc.save(`ZDC_Invoice_${res.razorpay_payment_id}.pdf`);
    }

    function processPayment() {
        const name = document.getElementById('client-name').value;
        const phone = document.getElementById('client-phone').value;
        const amt = parseFloat(document.getElementById('amt').value);

        if (!name || !phone) { alert("Customer name and phone required."); return; }
        if (amt / liveRates[document.getElementById('target-cur').value] < MIN_USD) {
            alert("Min $10 USD required."); return;
        }

        const options = {
            key: RZP_KEY,
            amount: finalSelection.amt,
            currency: finalSelection.cur,
            name: "ZDC Global",
            description: `Exchange Order ${finalSelection.requested} ${finalSelection.targetCur}`,
            handler: function(response) {
                generateInvoice(response, finalSelection, name, phone);
                alert("Payment Success! Downloading Invoice...");
                location.reload();
            },
            prefill: { name: name, contact: phone },
            theme: { color: "#3395ff" }
        };
        new Razorpay(options).open();
    }

    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calculate));
    document.getElementById('pay-btn').onclick = processPayment;
    syncRates();
</script>

</body>
</html>
