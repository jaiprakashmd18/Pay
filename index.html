<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZDC Global Payment Portal</title>
    <!-- Dependencies -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0b0d; --card: #161b22; --accent: #3395ff; --border: #30363d;
            --text: #ffffff; --sec: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        
        .card { 
            background: var(--card); 
            width: 100%; 
            max-width: 500px; 
            border-radius: 24px; 
            border: 1px solid var(--border); 
            padding: 30px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
        
        label { display: block; font-size: 0.7rem; text-transform: uppercase; color: var(--sec); margin-bottom: 8px; font-weight: 700; letter-spacing: 1.2px; }
        
        .input-box { 
            width: 100%; 
            padding: 14px; 
            background: #0d1117; 
            border: 1px solid var(--border); 
            color: white; 
            border-radius: 12px; 
            outline: none; 
            font-size: 1rem; 
            margin-bottom: 20px; 
            transition: all 0.2s;
        }
        .input-box:focus { border-color: var(--accent); background: #12181f; }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .live-math { 
            background: rgba(51, 149, 255, 0.06); 
            border: 1px solid rgba(51, 149, 255, 0.2); 
            border-radius: 16px; 
            padding: 24px; 
            margin-bottom: 25px; 
            text-align: center;
        }
        
        .total-line { font-size: 1.8rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
        .total-label { font-size: 0.75rem; color: var(--sec); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; }
        
        .btn { 
            width: 100%; 
            padding: 18px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-weight: 700; 
            font-size: 1rem;
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn:hover { background: #4ca3ff; transform: translateY(-1px); box-shadow: 0 10px 20px -10px rgba(51, 149, 255, 0.5); }
        .btn:active { transform: scale(0.98); }
        .badge { display: inline-block; padding: 4px 10px; background: rgba(35, 134, 54, 0.15); color: #3fb950; border-radius: 6px; font-size: 0.65rem; font-weight: 700; margin-bottom: 12px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="card">
    <div class="header">
        <span class="badge">SECURE GLOBAL PAY</span>
        <h2>ZDC Global</h2>
    </div>

    <label>Full Name</label>
    <input type="text" id="client-name" class="input-box" placeholder="John Doe">

    <label>Phone Number</label>
    <input type="tel" id="client-phone" class="input-box" placeholder="+1 234 567 890">

    <label>Amount to Receive</label>
    <input type="number" id="amt" class="input-box" value="100.00" min="10">

    <div class="row">
        <div class="form-group">
            <label>Currency to Get</label>
            <select id="target-cur" class="input-box">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GEL">GEL (₾)</option>
                <option value="GBP">GBP (£)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Pay Using</label>
            <select id="pay-cur" class="input-box">
                <option value="INR" selected>INR (₹)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="AED">AED (د.إ)</option>
                <option value="CAD">CAD ($)</option>
                <option value="GBP">GBP (£)</option>
                <option value="SAR">SAR (ر.س)</option>
                <option value="OMR">OMR (ر.ع.)</option>
            </select>
        </div>
    </div>

    <div class="live-math">
        <div class="total-label">Final Payable Amount</div>
        <div class="total-line"><span id="out-total">--</span></div>
    </div>

    <button class="btn" id="pay-btn">Proceed to Secure Payment</button>
</div>

<script>
    const RZP_KEY = 'rzp_test_SlAhlNeWJ4YdsA'; 
    const MIN_USD = 10.00;
    const SYSTEM_FEE_USD = 14; 
    
    const sym = { 
        USD: '$', INR: '₹', EUR: '€', GEL: '₾', GBP: '£', AED: 'د.إ', CAD: '$', 
        SAR: 'ر.س', OMR: 'ر.ع.'
    };

    let liveRates = {};
    let finalSelection = {};

    // Block F12, Ctrl+U, Ctrl+Shift+I
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };

    async function syncRates() {
        try {
            const res = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await res.json();
            liveRates = data.rates;
            calculate();
        } catch (e) {
            liveRates = { USD: 1, INR: 83.5, EUR: 0.92, GBP: 0.78, GEL: 2.7 };
            calculate();
        }
    }

    function applyRounding(val, curr) {
        if (curr === 'INR') return Math.ceil(val / 10) * 10;
        if (['USD', 'EUR', 'GBP'].includes(curr)) return Math.floor(val) + 0.90;
        return Math.ceil(val); 
    }

    function calculate() {
        if (!liveRates.USD) return;
        
        const amountWanted = parseFloat(document.getElementById('amt').value) || 0;
        const targetCur = document.getElementById('target-cur').value;
        const payCur = document.getElementById('pay-cur').value;

        const crossRate = liveRates[payCur] / liveRates[targetCur];
        const finalBase = amountWanted * crossRate;
        const feeInPayCur = (SYSTEM_FEE_USD * liveRates[payCur]) * 1.05;
        const roundedFee = applyRounding(feeInPayCur, payCur);
        const total = finalBase + roundedFee;

        const s = sym[payCur] || payCur;
        document.getElementById('out-total').innerText = `${s} ${total.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

        finalSelection = { 
            amt: Math.round(Number(total.toFixed(2)) * 100), 
            cur: payCur,
            requested: amountWanted,
            targetCur: targetCur,
            totalFormatted: `${s} ${(total).toLocaleString(undefined, {minimumFractionDigits: 2})}`
        };
    }

    function generateEnhancedPDF(res, selection, name, phone) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const primaryColor = [51, 149, 255];

        // 1. Header Bar
        doc.setFillColor(...primaryColor);
        doc.rect(0, 0, 210, 40, 'F');
        
        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(22);
        doc.text("ZDC GLOBAL", 20, 25);
        
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text("SECURE CURRENCY EXCHANGE INVOICE", 20, 32);
        
        doc.setFontSize(14);
        doc.text("STATUS: PAID", 160, 25);

        // 2. Alignment Grid (Left Column: User, Right Column: Meta)
        doc.setTextColor(40, 40, 40);
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text("BILL TO:", 20, 55);
        doc.text("INVOICE DETAILS:", 130, 55);

        doc.setFont("helvetica", "normal");
        doc.text(`Customer: ${name}`, 20, 62);
        doc.text(`Phone: ${phone}`, 20, 68);

        doc.text(`Invoice No: #ZDC-${res.razorpay_payment_id.slice(-6).toUpperCase()}`, 130, 62);
        doc.text(`Payment ID: ${res.razorpay_payment_id}`, 130, 68);
        doc.text(`Date: ${new Date().toLocaleString()}`, 130, 74);

        // 3. Perfectly Aligned Table
        doc.autoTable({
            startY: 85,
            head: [['Description', 'Qty', 'Unit', 'Total Price']],
            body: [
                [`Exchange Service (${selection.requested} ${selection.targetCur})`, '1', selection.cur, selection.totalFormatted],
            ],
            headStyles: { fillColor: primaryColor, halign: 'center' },
            columnStyles: {
                0: { cellWidth: 100 },
                1: { halign: 'center' },
                2: { halign: 'center' },
                3: { halign: 'right' }
            },
            theme: 'striped',
            margin: { left: 20, right: 20 }
        });

        // 4. Summary Calculation Aligned Right
        const finalY = doc.lastAutoTable.finalY + 15;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(12);
        doc.text("Total Paid:", 140, finalY);
        doc.setTextColor(...primaryColor);
        doc.text(selection.totalFormatted, 190, finalY, { align: 'right' });

        // 5. Footer and Watermark
        doc.setFontSize(8);
        doc.setTextColor(180, 180, 180);
        const footerY = 280;
        doc.text("This is a digitally signed receipt and requires no physical signature.", 105, footerY, { align: 'center' });
        doc.text("ZDC Global © 2026 - Secure Global Remittance", 105, footerY + 5, { align: 'center' });

        doc.save(`ZDC_Invoice_${res.razorpay_payment_id}.pdf`);
    }

    function processPayment() {
        const name = document.getElementById('client-name').value;
        const phone = document.getElementById('client-phone').value;
        const amountRequested = parseFloat(document.getElementById('amt').value);

        const targetCur = document.getElementById('target-cur').value;
        const amtInUSD = amountRequested / liveRates[targetCur];

        if (!name || !phone) { alert("Please provide customer details."); return; }
        if (amtInUSD < MIN_USD) { alert("Minimum request is $10.00 USD."); return; }

        const options = {
            key: RZP_KEY,
            amount: finalSelection.amt,
            currency: finalSelection.cur,
            name: "ZDC Global",
            description: `Exchange Order ${finalSelection.requested} ${finalSelection.targetCur}`,
            handler: function(response) {
                generateEnhancedPDF(response, finalSelection, name, phone);
                alert("Payment Successful. Your Invoice has been generated.");
                location.reload();
            },
            prefill: { name: name, contact: phone },
            theme: { color: "#3395ff" }
        };
        new Razorpay(options).open();
    }

    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calculate));
    document.getElementById('pay-btn').onclick = processPayment;
    syncRates();
</script>

</body>
</html>
