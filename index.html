<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZDC Global Payment Portal</title>
    <!-- Dependencies -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0b0d; --card: #161b22; --accent: #3395ff; --border: #30363d;
            --text: #ffffff; --sec: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        
        .card { 
            background: var(--card); 
            width: 100%; 
            max-width: 500px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            padding: 25px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
        
        label { display: block; font-size: 0.65rem; text-transform: uppercase; color: var(--sec); margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }
        
        .input-box { 
            width: 100%; 
            padding: 14px; 
            background: #0d1117; 
            border: 1px solid var(--border); 
            color: white; 
            border-radius: 12px; 
            outline: none; 
            font-size: 1rem; 
            margin-bottom: 15px; 
        }
        .input-box:focus { border-color: var(--accent); }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .live-math { 
            background: rgba(51, 149, 255, 0.04); 
            border: 1px solid rgba(51, 149, 255, 0.2); 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 20px; 
            text-align: center;
        }
        
        .total-line { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
        .total-label { font-size: 0.7rem; color: var(--sec); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1.5px; }
        
        .btn { 
            width: 100%; 
            padding: 16px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .btn:hover { background: #4ca3ff; }
        .btn:active { transform: scale(0.98); }
        .badge { display: inline-block; padding: 4px 8px; background: rgba(35, 134, 54, 0.15); color: #3fb950; border-radius: 4px; font-size: 0.6rem; font-weight: 700; margin-bottom: 8px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="card">
    <div class="header">
        <span class="badge">SECURE GLOBAL GATEWAY</span>
        <h2>ZDC Global Checkout</h2>
    </div>

    <label>Full Name</label>
    <input type="text" id="client-name" class="input-box" placeholder="Customer Name">

    <label>Phone Number</label>
    <input type="tel" id="client-phone" class="input-box" placeholder="+1 ...">

    <label>Amount to Receive</label>
    <input type="number" id="amt" class="input-box" value="10.00" min="10">

    <div class="row">
        <div class="form-group">
            <label>Currency to Get</label>
            <select id="target-cur" class="input-box">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GEL">GEL (₾)</option>
                <option value="GBP">GBP (£)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Pay Using</label>
            <select id="pay-cur" class="input-box">
                <option value="USD">USD ($)</option>
                <option value="INR" selected>INR (₹)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
                <option value="AED">AED (د.إ)</option>
                <option value="CAD">CAD ($)</option>
                <option value="AUD">AUD ($)</option>
                <option value="SGD">SGD ($)</option>
                <option value="JPY">JPY (¥)</option>
                <option value="GEL">GEL (₾)</option>
                <option value="SAR">SAR (ر.س)</option>
                <option value="QAR">QAR (ر.ق)</option>
                <option value="THB">THB (฿)</option>
                <option value="MYR">MYR (RM)</option>
                <option value="CNY">CNY (¥)</option>
                <option value="ZAR">ZAR (R)</option>
                <option value="NZD">NZD ($)</option>
                <option value="CHF">CHF (Fr)</option>
                <option value="OMR">OMR (ر.ع.)</option>
                <option value="KWD">KWD (د.ك)</option>
            </select>
        </div>
    </div>

    <div class="live-math">
        <div class="total-label">Total Invoice Amount</div>
        <div class="total-line"><span id="out-total">--</span></div>
    </div>

    <button class="btn" id="pay-btn">Initialize Secure Payment</button>
</div>

<script>
    const RZP_KEY = 'rzp_test_SlAhlNeWJ4YdsA'; 
    const MIN_USD = 10.00;
    const SYSTEM_FEE_USD = 14; 
    
    const sym = { 
        USD: '$', INR: '₹', EUR: '€', GEL: '₾', GBP: '£', AED: 'د.إ', CAD: '$', AUD: '$', 
        SGD: '$', JPY: '¥', SAR: 'ر.س', QAR: 'ر.ق', THB: '฿', MYR: 'RM', CNY: '¥', 
        ZAR: 'R', NZD: '$', CHF: 'Fr', OMR: 'ر.ع.', KWD: 'د.ك' 
    };

    let liveRates = {};
    let finalSelection = {};

    // Security: Block F12, Ctrl+U, Ctrl+Shift+I
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };

    async function syncRates() {
        try {
            const res = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await res.json();
            liveRates = data.rates;
            calculate();
        } catch (e) {
            console.error("Rate sync failed");
            // Fallback rates if API is down
            liveRates = { USD: 1, INR: 83, EUR: 0.92, GBP: 0.78, GEL: 2.7 };
            calculate();
        }
    }

    function applyRounding(val, curr) {
        if (curr === 'INR') return Math.ceil(val / 10) * 10;
        if (['USD', 'EUR', 'GBP'].includes(curr)) return Math.floor(val) + 0.90;
        return Math.ceil(val); 
    }

    function calculate() {
        if (!liveRates.USD) return;
        
        const amountWanted = parseFloat(document.getElementById('amt').value) || 0;
        const targetCur = document.getElementById('target-cur').value;
        const payCur = document.getElementById('pay-cur').value;

        // Calculate base exchange
        const crossRate = liveRates[payCur] / liveRates[targetCur];
        const finalBase = amountWanted * crossRate;
        
        // Hidden Fee Calculation
        const feeInPayCur = (SYSTEM_FEE_USD * liveRates[payCur]) * 1.05;
        const roundedFee = applyRounding(feeInPayCur, payCur);
        const total = finalBase + roundedFee;

        const symbol = sym[payCur] || payCur;
        document.getElementById('out-total').innerText = `${symbol} ${total.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

        finalSelection = { 
            amt: Math.round(Number(total.toFixed(2)) * 100), 
            cur: payCur,
            requested: amountWanted,
            targetCur: targetCur,
            totalFormatted: `${symbol} ${(total).toLocaleString()}`
        };
    }

    function generateInvoice(res, selection, name, phone) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Color Theme
        const primary = [51, 149, 255];
        
        // Header Banner
        doc.setFillColor(...primary);
        doc.rect(0, 0, 210, 45, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(24);
        doc.setFont("helvetica", "bold");
        doc.text("ZDC GLOBAL", 15, 25);
        doc.setFontSize(10);
        doc.text("OFFICIAL PAYMENT INVOICE", 15, 33);
        
        doc.setFontSize(12);
        doc.text("STATUS: SUCCESSFUL / PAID", 140, 25);

        // Body Content
        doc.setTextColor(40, 40, 40);
        doc.setFontSize(12);
        doc.setFont("helvetica", "bold");
        doc.text("BILL TO:", 15, 60);
        doc.setFont("helvetica", "normal");
        doc.text(`Customer: ${name}`, 15, 68);
        doc.text(`Contact: ${phone}`, 15, 75);
        
        doc.setFont("helvetica", "bold");
        doc.text("TRANSACTION DETAILS:", 120, 60);
        doc.setFont("helvetica", "normal");
        doc.text(`Ref ID: ${res.razorpay_payment_id}`, 120, 68);
        doc.text(`Date: ${new Date().toLocaleString()}`, 120, 75);

        // Invoice Table
        doc.autoTable({
            startY: 90,
            head: [['Service Description', 'Currency', 'Quantity', 'Total']],
            body: [
                [`Cross-Border Exchange (${selection.requested} ${selection.targetCur})`, selection.cur, '1', selection.totalFormatted],
            ],
            headStyles: { fillColor: primary, textColor: [255, 255, 255] },
            theme: 'grid'
        });

        const finalY = doc.lastAutoTable.finalY + 20;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.text(`Grand Total Paid: ${selection.totalFormatted}`, 120, finalY);

        // Legal Footer
        doc.setFontSize(8);
        doc.setTextColor(150, 150, 150);
        doc.text("ZDC Global provides secure escrow-based currency exchange services.", 105, 275, { align: "center" });
        doc.text("This document serves as proof of payment and is generated automatically.", 105, 280, { align: "center" });

        doc.save(`ZDC_Invoice_${res.razorpay_payment_id}.pdf`);
    }

    function processPayment() {
        const name = document.getElementById('client-name').value;
        const phone = document.getElementById('client-phone').value;
        const amountRequested = parseFloat(document.getElementById('amt').value);

        const targetCur = document.getElementById('target-cur').value;
        const amtInUSD = amountRequested / liveRates[targetCur];

        if (!name || !phone) { alert("Please complete customer details."); return; }
        if (amtInUSD < MIN_USD) { alert(`The minimum exchange amount is $10.00 USD.`); return; }

        const options = {
            key: RZP_KEY,
            amount: finalSelection.amt,
            currency: finalSelection.cur,
            name: "ZDC Global",
            description: `Invoice for ${finalSelection.requested} ${finalSelection.targetCur}`,
            handler: function(response) {
                generateInvoice(response, finalSelection, name, phone);
                alert("Payment Verified. Your professional invoice is downloading.");
                location.reload();
            },
            prefill: { name: name, contact: phone },
            theme: { color: "#3395ff" }
        };
        
        try {
            const rzp = new Razorpay(options);
            rzp.open();
        } catch (e) {
            alert("Payment Gateway Error. Check your connection.");
        }
    }

    // Listeners
    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calculate));
    document.getElementById('pay-btn').onclick = processPayment;
    
    // Initial Sync
    syncRates();
</script>

</body>
</html>
